<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FitoEssência | BI Logístico</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#e8eff9;background:#0a1222}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}.side{width:225px;background:#0e1b30;padding:25px 15px;border-right:1px solid #25354b}.brand{font-weight:800;font-size:19px;margin-bottom:6px}.brand b{color:#3ce0b0}.sub{font-size:11px;color:#8295ad;margin-bottom:30px}.nav{width:100%;border:0;text-align:left;background:none;color:#aabbd0;padding:13px;border-radius:9px;cursor:pointer;margin:3px 0}.nav.active,.nav:hover{background:#1a3551;color:#fff}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:25px}p{color:#94a8c2;margin:7px 0 20px}.pill{font-size:12px;background:#29334c;color:#f3d4a4;border-radius:30px;padding:8px 12px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}select,button.action{background:#15243a;color:#e9f2ff;border:1px solid #344762;border-radius:8px;padding:10px 12px}.action{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:13px}.card,.panel{background:#122137;border:1px solid #253954;border-radius:13px;padding:18px}.card small{color:#9db0c9}.number{font-size:27px;font-weight:800;margin:13px 0 5px}.delta{font-size:12px;color:#42dbad}.panels{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:17px}.panel h3{margin:0 0 16px;font-size:15px}.bars{height:210px;display:flex;align-items:end;gap:12px;border-bottom:1px solid #3a4c64;padding:0 8px 0}.barset{flex:1;display:flex;align-items:end;justify-content:center;gap:4px;height:100%}.bar{width:35%;border-radius:5px 5px 0 0;background:#38caa5}.bar.alt{background:#4488d8}.labels{display:flex;justify-content:space-around;color:#8fa6c1;font-size:12px;margin-top:9px}.legend{color:#9eb0c8;font-size:12px;margin-top:16px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:#38caa5}.dot.blue{background:#4488d8;margin-left:15px}.carrier{display:flex;align-items:center;gap:10px;margin:18px 0;color:#c5d4e6;font-size:13px}.carrier span{width:85px}.track{flex:1;background:#263b54;height:10px;border-radius:8px;overflow:hidden}.fill{height:100%;background:#3bcba7;border-radius:8px}.carrier strong{width:48px;text-align:right}.notice{margin-top:16px;color:#98aac2;font-size:12px}.empty{padding:35px 0;text-align:center;color:#a9b9ce}.table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:13px 8px;text-align:left;border-bottom:1px solid #2b3c53}th{color:#92a8c4}td{color:#d7e5f5}@media(max-width:850px){.side{width:65px;padding:16px 7px}.brand{font-size:11px}.brand b,.sub,.nav span{display:none}.nav{text-align:center}.main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:420px){.number{font-size:21px}.card{padding:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Fito<b>Essência</b></div><div class="sub">LOGISTICS INTELLIGENCE</div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="heading">Visão geral</h1><p>Central de inteligência logística • Protótipo de layout</p></div><div class="pill">● DADOS DEMONSTRATIVOS</div></div><div class="filters"><select id="period"><option value="week">Esta semana (exemplo)</option><option value="month">Este mês (exemplo)</option></select><select id="theme"><option value="dark">Tema escuro</option><option value="light">Tema claro</option></select><button class="action" id="export">Exportar resumo CSV</button></div><div id="content"></div><div class="notice">Protótipo visual. Nenhum dado real foi importado. Filtros e exportação funcionam com valores fictícios.</div></main></div><script>
const pages=[['overview','▦','Visão geral'],['shipping','▣','Expedição'],['carriers','▤','Transportadoras'],['freight','◈','Fretes'],['inventory','▥','Estoque']];let current='overview';let period='week';const weekly={received:2870,shipped:2784,pending:86,rate:97.0,cost:45321,average:16.28};const monthly={received:12450,shipped:12180,pending:270,rate:97.83,cost:196330,average:16.12};const carriers=[['Correios',36],['Loggi',27],['J&T',22],['Jadlog',11],['Outras',4]];const data=()=>period==='week'?weekly:monthly;function fmt(v){return Number(v).toLocaleString('pt-BR')};function money(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};function card(label,value,detail){return `<div class="card"><small>${label}</small><div class="number">${value}</div><div class="delta">${detail}</div></div>`};function bars(){let a=period==='week'?[510,640,560,610,550]:[2100,2380,2450,2670,2850];let b=a.map((x,i)=>x-[18,26,14,30,20][i]);return `<div class="panel"><h3>Pedidos recebidos × expedidos</h3><div class="bars">${a.map((v,i)=>`<div class="barset"><div class="bar" style="height:${v/Math.max(...a)*90}%" title="Recebidos: ${v}"></div><div class="bar alt" style="height:${b[i]/Math.max(...a)*90}%" title="Expedidos: ${b[i]}"></div></div>`).join('')}</div><div class="labels">${(period==='week'?['Seg','Ter','Qua','Qui','Sex']:['Sem 1','Sem 2','Sem 3','Sem 4','Sem 5']).map(x=>`<span>${x}</span>`).join('')}</div><div class="legend"><i class="dot"></i>Recebidos <i class="dot blue"></i>Expedidos</div></div>`};function carrierPanel(){return `<div class="panel"><h3>Participação por transportadora</h3>${carriers.map(([name,n])=>`<div class="carrier"><span>${name}</span><div class="track"><div class="fill" style="width:${n}%"></div></div><strong>${n}%</strong></div>`).join('')}</div>`};function table(title,rows){return `<div class="panel"><h3>${title}</h3><table class="table"><thead><tr>${rows[0].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};function render(){document.getElementById('nav').innerHTML=pages.map(([id,ic,name])=>`<button class="nav ${current===id?'active':''}" data-id="${id}">${ic} <span>${name}</span></button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{current=b.dataset.id;render()});document.getElementById('heading').textContent=pages.find(x=>x[0]===current)[2];let d=data(),html='';if(current==='overview'){html=`<div class="cards">${card('Pedidos recebidos',fmt(d.received),'Volume no período')}${card('Pedidos expedidos',fmt(d.shipped),'Volume no período')}${card('Taxa de expedição',fmt(d.rate)+'%','Expedidos ÷ recebidos')}${card('Pedidos pendentes',fmt(d.pending),'Saldo demonstrativo')}</div><div class="panels">${bars()}${carrierPanel()}</div>`}else if(current==='shipping'){html=`<div class="cards">${card('Recebidos',fmt(d.received),'Pedidos')}${card('Expedidos',fmt(d.shipped),'Pedidos')}${card('Pendentes',fmt(d.pending),'Pedidos')}${card('Taxa',fmt(d.rate)+'%','Indicador ilustrativo')}</div><div class="panels">${bars()}${table('Status operacional',[['Status','Pedidos'],['Expedidos',fmt(d.shipped)],['Pendentes',fmt(d.pending)]])}</div>`}else if(current==='carriers'){html=`<div class="cards">${card('Transportadoras','5','Categorias demonstrativas')}${card('Maior participação','Correios','36% dos envios')}${card('Volume expedido',fmt(d.shipped),'Pedidos')}${card('Período',period==='week'?'Semanal':'Mensal','Filtro selecionado')}</div><div class="panels">${carrierPanel()}${table('Participação',[['Transportadora','%','Pedidos estimados'],...carriers.map(([n,p])=>[n,p+'%',fmt(Math.round(d.shipped*p/100))])])}</div>`}else if(current==='freight'){html=`<div class="cards">${card('Custo total',money(d.cost),'Fictício')}${card('Frete médio',money(d.average),'Fictício')}${card('Pedidos expedidos',fmt(d.shipped),'Volume')}${card('Divergências','—','Sem dados reais')}</div><div class="panels">${table('Visão financeira',[['Indicador','Valor'],['Custo total',money(d.cost)],['Custo médio',money(d.average)]])}<div class="panel"><h3>Próximos gráficos</h3><div class="empty">Custo por transportadora<br>Economia mensal<br>Contestações de fatura</div></div></div>`}else{html=`<div class="cards">${card('SKUs ativos','—','Aguardando base')}${card('Curva A','—','Aguardando base')}${card('Curva B','—','Aguardando base')}${card('Curva C','—','Aguardando base')}</div><div class="panels">${table('Estrutura prevista',[['Indicador','Situação'],['Saldo por SKU','Aguardando dados'],['Rupturas','Aguardando dados'],['Curva ABC','Aguardando dados']])}<div class="panel"><h3>Estoque</h3><div class="empty">Área preparada para gráficos<br>de estoque e curva ABC</div></div></div>`}document.getElementById('content').innerHTML=html};document.getElementById('period').onchange=e=>{period=e.target.value;render()};document.getElementById('theme').onchange=e=>{const light=e.target.value==='light';document.documentElement.style.filter=light?'invert(.88) hue-rotate(170deg)':'none'};document.getElementById('export').onclick=()=>{const d=data();const csv='Indicador;Valor\nRecebidos;'+d.received+'\nExpedidos;'+d.shipped+'\nPendentes;'+d.pending+'\nTaxa;'+d.rate+'\nCusto;'+d.cost;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='resumo_logistico_demonstrativo.csv';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
